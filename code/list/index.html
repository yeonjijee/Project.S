<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project.S — 영웅 리스트</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fxCanvas"></canvas>
<div id="handCursor"></div>

<!-- 배경: 흐린 Project.S 로고 + 다른 페이지(ARCHIVE) 이름 — 테스트 화면과 같은 규칙 (빨강 #a70000 / 배경 #e2e2dc / AG 제목 + 을유 본문) -->
<div class="bg-logo" aria-hidden="true"></div>
<div class="bg-word" aria-hidden="true">ARCHIVE</div>

<header class="hl-head">
  <a class="hl-back" href="../index.html" aria-label="테스트로 돌아가기"><svg viewBox="-0.5 -0.5 5 5" aria-hidden="true"><polygon points="0,-0.5 0.5,0 0,0.5 -0.5,0"/><polygon points="1,-0.5 1.5,0 1,0.5 0.5,0"/><polygon points="2,-0.5 2.5,0 2,0.5 1.5,0"/><polygon points="3,-0.5 3.5,0 3,0.5 2.5,0"/><polygon points="4,-0.5 4.5,0 4,0.5 3.5,0"/><polygon points="0,0.5 0.5,1 0,1.5 -0.5,1"/><polygon points="0,1.5 0.5,2 0,2.5 -0.5,2"/><polygon points="0,2.5 0.5,3 0,3.5 -0.5,3"/><polygon points="0,3.5 0.5,4 0,4.5 -0.5,4"/></svg></a>
  <svg class="hl-title" data-text="HERO LIST" preserveAspectRatio="none" aria-label="HERO LIST"></svg>
  <nav class="hl-links">
    <a href="../index.html">TEST</a>
    <a href="../archive/index.html">ARCHIVE</a>
  </nav>
  <div class="hl-meta">
    <p class="hl-lede">50년, 49개 시리즈, 310명.<br>한 줄이 하나의 전대예요.<br>옆으로 넘겨 그 전대의 모든 레인저,<br>카드를 눌러 그 영웅의 이야기를 살펴보세요.</p>
    <label class="hl-search"><span>찾기</span><input type="text" id="searchInput" placeholder="이름 또는 시리즈" autocomplete="off"><em id="searchCount"></em></label>
  </div>
</header>

<main id="main"></main>
<div class="empty-filter" id="emptyFilter" style="display:none;">검색 결과가 없습니다.</div>

<!-- 영웅 상세 — 화면 전체 한 장 -->
<div class="modal-overlay" id="modalOverlay">
  <button class="modal-close" onclick="closeModal()" aria-label="닫기"><svg viewBox="-0.5 -0.5 5 5" aria-hidden="true"><polygon points="0,-0.5 0.5,0 0,0.5 -0.5,0"/><polygon points="1,-0.5 1.5,0 1,0.5 0.5,0"/><polygon points="2,-0.5 2.5,0 2,0.5 1.5,0"/><polygon points="3,-0.5 3.5,0 3,0.5 2.5,0"/><polygon points="4,-0.5 4.5,0 4,0.5 3.5,0"/><polygon points="0,0.5 0.5,1 0,1.5 -0.5,1"/><polygon points="0,1.5 0.5,2 0,2.5 -0.5,2"/><polygon points="0,2.5 0.5,3 0,3.5 -0.5,3"/><polygon points="0,3.5 0.5,4 0,4.5 -0.5,4"/></svg></button>
  <div class="modal-hero"><canvas id="modalCanvas" width="600" height="800"></canvas></div>
  <div class="modal-box"><div id="modalBody"></div></div>
</div>

<script src="mosaic.js"></script>
<script src="script.js"></script>
<script src="hand.js"></script>
<script src="../fx.js"></script>
</body>
</html>
