<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project.S — 기록의 벽</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="fxCanvas"></canvas>
<div class="cam-status" id="camStatus"></div>
<div id="handCursor"></div>

<!-- 테스트 화면 규칙: 왼쪽 세로로 늘인 ARCHIVE(AG 빨강) / 오른쪽 기록 나선 / 오른쪽 끝 10vw NEXT 띠(테스트로) -->
<div class="bg-logo" aria-hidden="true"></div>
<a class="bg-word" id="heroListLink" href="../list/index.html">HERO LIST</a>

<section class="globe-section">
  <svg class="ar-title" data-text="ARCHIVE" preserveAspectRatio="none" aria-label="ARCHIVE"></svg>

  <div class="ar-side">
    <p class="ar-lede">멸종된 것은 파워레인저가 아니라,<br>어쩌면 우리 안의 영웅성이었을지도 모릅니다</p>
    <div class="stat-row">
      <div class="stat"><span class="num" id="statCount">0</span><span class="lbl">기록된 이야기</span></div>
      <div class="stat"><span class="num" id="statHeroes">0</span><span class="lbl">서로 다른 영웅</span></div>
    </div>
  </div>

  <label class="ar-search"><span>찾기</span><input type="text" id="nickSearch" placeholder="닉네임" autocomplete="off" spellcheck="false"><em id="nickCount"></em></label>
  <div class="globe-stage" id="globeStage"></div>
  <div id="globeLabels"></div>
  <div class="focus-info" id="focusInfo"></div>

  <div class="globe-overlay-bottom">
    <div class="top-heroes" id="topHeroes"></div>
    <div class="globe-hint">주먹 쥐고 끌기 = 지구본 돌리기 · 기록 위에서 주먹 쥐었다 펴기 = 자세히 보기</div>
  </div>

  <div class="empty" id="emptyState" style="display:none;">
    아직 기록이 없습니다.<br>
    테스트를 끝까지 마치면 여기에 한 칸으로 남습니다.
  </div>

</section>

<!-- 기록 자세히 — 누르면 화면이 왼쪽으로 밀리고 여기가 오른쪽에 -->
<aside class="ar-detail" id="arDetail">
  <button class="ad-close" onclick="closeArchiveDetail()" aria-label="닫기"><svg viewBox="-0.5 -0.5 5 5" aria-hidden="true"><polygon points="0,-0.5 0.5,0 0,0.5 -0.5,0"/><polygon points="1,-0.5 1.5,0 1,0.5 0.5,0"/><polygon points="2,-0.5 2.5,0 2,0.5 1.5,0"/><polygon points="3,-0.5 3.5,0 3,0.5 2.5,0"/><polygon points="4,-0.5 4.5,0 4,0.5 3.5,0"/><polygon points="0,0.5 0.5,1 0,1.5 -0.5,1"/><polygon points="0,1.5 0.5,2 0,2.5 -0.5,2"/><polygon points="0,2.5 0.5,3 0,3.5 -0.5,3"/><polygon points="0,3.5 0.5,4 0,4.5 -0.5,4"/></svg></button>
  <div id="arDetailBody"></div>
</aside>

<!-- 관리자용 — 전시 화면에서는 숨김 (style.css .admin-only) -->
<div class="admin-only">
  <a href="../list/index.html" target="_blank" class="list-link">전체 영웅 리스트 보기 ↗</a>
  <a href="../index.html" target="_blank" class="test-link">수호 영웅 매칭 테스트 하러 가기 ↗</a>
  <div class="toolbar">
    <button class="btn" onclick="document.getElementById('importFile').click()">기록 가져오기 (JSON)</button>
    <input type="file" id="importFile" accept="application/json">
    <button class="btn" onclick="exportArchive()">기록 내보내기 (JSON)</button>
    <button class="btn" onclick="loadSample()">데모용 샘플 기록 불러오기</button>
    <button class="btn" onclick="clearArchive()">기록 초기화</button>
  </div>
</div>

<script src="../../files/vendor/three/three.min.js"></script>
<script src="../mosaic.js"></script>
<script src="script.js"></script>
<script src="gallery.js"></script>
<script src="../fx.js"></script>
<script>
/* ARCHIVE 제목 — AG 잉크 영역에 맞춰 칸 크기대로 늘린다 */
(function(){
  const svg = document.querySelector('.ar-title'); const text = svg.dataset.text;
  const c = document.createElement('canvas').getContext('2d');
  document.fonts.load('1000px AGSuperBlack').then(() => {
    c.font = '1000px AGSuperBlack'; const m = c.measureText(text);
    const x0 = -m.actualBoundingBoxLeft, x1 = m.actualBoundingBoxRight, y0 = -m.actualBoundingBoxAscent, y1 = m.actualBoundingBoxDescent;
    svg.setAttribute('viewBox', `${x0} ${y0} ${x1 - x0} ${y1 - y0}`);
    svg.innerHTML = '<text x="0" y="0" font-size="1000"></text>'; svg.querySelector('text').textContent = text;
  });
})();
</script>
</body>
</html>
