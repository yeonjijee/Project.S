<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project.S — mosaic test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  *{box-sizing:border-box;}
  html,body{margin:0;background:#000;color:#f2f0ea;font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:6vh 4vw;}
  h1{font-size:14px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#888;margin:0 0 4vh;}
  .stage{position:relative;width:min(520px,90vw);aspect-ratio:1/1;background:#0b0b0b;border:1px solid #222;}
  canvas{width:100%;height:100%;display:block;}
  .drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#666;text-align:center;padding:2rem;border:1px dashed #333;cursor:pointer;}
  .controls{width:min(520px,90vw);margin-top:3vh;display:flex;flex-direction:column;gap:1.4rem;}
  .row label{display:block;font-size:12px;color:#888;margin-bottom:8px;}
  input[type=range]{width:100%;}
  .val{font-size:13px;color:#f2f0ea;}
  input[type=file]{display:none;}
</style>
</head>
<body>

<h1>Project.S — mosaic reveal test</h1>

<div class="stage">
  <canvas id="c" width="600" height="600"></canvas>
  <label class="drop" id="drop" for="fileInput">이미지를 여기로 드래그하거나 클릭해서 불러오기<br>(레인저 이미지로 직접 테스트해줘)</label>
</div>
<input type="file" id="fileInput" accept="image/*">

<div class="controls">
  <div class="row">
    <label>도트 크기 (px) <span class="val" id="cellVal">14</span></label>
    <input type="range" id="cell" min="4" max="40" value="14" step="1">
  </div>
</div>

<script src="mosaic.js"></script>
<script>
  const RATE = 1.0; // 지금 단계는 rate 100% 고정 — 완전 추상 상태만 확인
  const canvas = document.getElementById('c');
  const dropLabel = document.getElementById('drop');
  const fileInput = document.getElementById('fileInput');
  const cellInput = document.getElementById('cell');
  let renderer = null;

  function loadImage(src){
    const img = new Image();
    img.onload = () => {
      renderer = new MosaicRenderer(canvas, img, { cell: parseInt(cellInput.value,10) });
      dropLabel.style.display = 'none';
      redraw();
    };
    img.src = src;
  }

  function redraw(){
    if(!renderer) return;
    renderer.cell = parseInt(cellInput.value,10); // 캔버스 실제 px(600×600) 기준 그리드 간격
    renderer.render(RATE);
    document.getElementById('cellVal').textContent = cellInput.value;
  }

  fileInput.addEventListener('change', e => {
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => loadImage(ev.target.result);
    reader.readAsDataURL(f);
  });

  ['dragover'].forEach(evt => dropLabel.addEventListener(evt, e => { e.preventDefault(); }));
  dropLabel.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => loadImage(ev.target.result);
    reader.readAsDataURL(f);
  });

  cellInput.addEventListener('input', redraw);
</script>
</body>
</html>
